name: Build Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Add google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if echo "$GSJ" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            printf '%s' "$GSJ" > app/google-services.json
          else
            echo "$GSJ" | base64 -d > app/google-services.json
          fi
          python3 -c "import json; json.load(open('app/google-services.json')); print('google-services.json OK')"

      - name: Build
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
